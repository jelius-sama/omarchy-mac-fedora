# Define terminal tag to style them uniformly
windowrule = tag +terminal, match:class (Alacritty|kitty)
windowrule = tag -default-opacity, match:tag terminal
windowrule = opacity 0.97 0.9, match:tag terminal

windowrule = tag +special_terminal, match:class (com.mitchellh.ghostty)
windowrule = tag -default-opacity, match:tag special_terminal
